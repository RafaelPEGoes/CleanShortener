name: Unit Tests

run-name: Unit Tests for ${{ github.ref_name }}
on:
  push:
    branches:
    - main

  pull_request:
    branches:
      - main

jobs:
  build:
      uses: ./.github/workflows/build.yaml

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Run Unit Tests
        run: |
          dotnet test CleanShortener.Tests\CleanShortener.Tests.csproj
          --filter "FullyQualifiedName!~ArchitecturalTests"
          --no-build
          --configuration Release
          --logger:"console;verbosity=detailed"
          --logger:"html;logfilename=testResults.html"

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: testResults
          path: CleanShortener.Tests\TestResults\testResults.html