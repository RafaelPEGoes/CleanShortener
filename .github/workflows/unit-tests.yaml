name: Unit Tests

run-name: Unit Tests for ${{ github.ref_name }}
on:
  push:
    branches:
      - main
      - 'release/*'

  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true

      - name: Restore Dependencies
        run: dotnet restore
      - name: Build Solution
        run: dotnet build CleanShortener.sln --no-restore --configuration Release