name: Unit Tests

run-name: Unit Tests for ${{ github.ref_name }}
on:
  push:
    branches:
    - main
  pull_request:
    branches:
      - main

jobs:
  build:
      uses: ./.github/workflows/build.yaml

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Run Unit Tests
        run: dotnet test --filter "FullyQualifiedName!~ArchitecturalTests" --no-build --configuration Release --logger:"console;verbosity=detailed" --logger:"html;logfilename=testResults.html" CleanShortener.Tests\CleanShortener.Tests.csproj

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: testResults
          path: CleanShortener.Tests\TestResults\testResults.html