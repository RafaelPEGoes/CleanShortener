name: Build

run-name: Build for ${{ github.ref }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    outputs:
      publish_folder:
        description: Folder in which the application was published to.
        value: ${{ jobs.build.outputs.publish_folder }}

env:
  PUBLISH_FOLDER: release
  MAIN_APPLICATION_PATH: CleanShortener/CleanShortener.csproj
  ARTIFACT_NAME: CleanShortener

jobs:
  build:
    runs-on: windows-latest
    outputs:
      publish_folder: ${{ steps.set-output.outputs.publish_folder }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache-dependency-path: '**/packages.lock.json'
          cache: true

      - name: Restore Dependencies
        run: dotnet restore --locked-mode

      - name: Publish project
        run: |
          dotnet publish ${{ env.MAIN_APPLICATION_PATH }} `
          -c Release `
          -o ${{ env.PUBLISH_FOLDER }} `
          --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PUBLISH_FOLDER }}

      - name: Output publish folder
        id: set-output
        run: echo "publish_folder=${{ env.PUBLISH_FOLDER }}" >> $env:GITHUB_OUTPUT