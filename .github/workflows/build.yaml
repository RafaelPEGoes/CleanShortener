name: Build

run-name: Build for ${{ github.ref }}

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main

env:
  PUBLISH_FOLDER: release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache-dependency-path: '**/packages.lock.json'
          cache: true

      - name: Restore Dependencies
        run: dotnet restore --locked-mode

      - name: Build Solution
        run: dotnet publish CleanShortener.sln -c Release -o $PUBLISH_FOLDER --no-restore

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: $PUBLISH_FOLDER/