name: Build

run-name: Build for ${{ github.ref }}

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main

env:
  BASE_PUBLISH_FOLDER: release

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - name: MainProject
            project: CleanShortener/CleanShortener.csproj
          - name: UnitTestsProject
            project: CleanShortener.Tests/CleanShortener.Tests.csproj
          - name: BDDProject
            project: CleanShortener.BDD.Demo/CleanShortener.BDD.Demo.csproj

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache-dependency-path: '**/packages.lock.json'
          cache: true

      - name: Restore Dependencies
        run: dotnet restore --locked-mode

      - name: Publish project ${{ matrix.name }}
        run: |
          dotnet publish ${{ matrix.project }} -c Release -o "$BASE_PUBLISH_FOLDER/${{ matrix.name }}" --no-restore

      - name: Upload artifact for ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.BASE_PUBLISH_FOLDER }}/${{ matrix.name }}
